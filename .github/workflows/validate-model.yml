name: Validate Northwind DW

on:
  push:
    paths:
      - "data/**"
      - "tests/**"
      - "scripts/**"
  pull_request:
    paths:
      - "data/**"
      - "tests/**"
      - "scripts/**"

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install openpyxl pytest
      - name: Run model QA tests
        run: pytest -q
